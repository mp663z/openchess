name: Canary

on:
  push:
    branches: [main]

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: the DAG reconcile history anchor needs it
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Install git hooks
        run: bash tools/setup.sh
      - name: Post-merge canary
        run: python tools/canary.py
