name: CI

on:
  push:
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: the DAG reconcile history anchor needs it
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Release lock is current
        run: python tools/lock_release.py --check
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python tools/test_gate.py
      - name: DAG integrity
        run: python tools/dag.py verify
      - name: Evidence contract
        run: python tools/evidence_lint.py
      - name: License audit
        run: python tools/license_audit.py
      - name: License lint (T0008)
        run: python tools/license_lint.py
      - name: Governance docs lint
        run: python tools/governance_doc_lint.py
      - name: Install git hooks
        run: bash tools/setup.sh
      - name: Install checks (good passes, seeded violation caught)
        run: python -m tools.install_checks.runner
      - name: CLA gate
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/cla_check.py
      - name: Docs parse
        run: python -c "import json,yaml,pathlib; json.load(open('tasks/dag.json')); yaml.safe_load(open('scope/v0.1.yaml')); print('docs ok', pathlib.Path('README.md').stat().st_size)"
