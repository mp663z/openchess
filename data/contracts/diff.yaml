schema_version: 1

contract:
  id: graph-diff
  role:
    kind: exact-difference-record-between-two-graph-states
    serves: no-silent-writes-approval-gate
    scope: graph-state-differences
    owns: diff-record-shape-and-computation-semantics
    not_scope: scoring-or-ranking-of-changes
  record:
    fields: [base_id, target_id, added, removed, changed]
    exact: true
  identity:
    key_source: from-linked-table-contracts-canonical-identity
    digest_keys: never-keyed-by-accelerator-digests
    restated: never
  sections:
    added:
      kind: map-canonical-identity-to-exact-target-record
      meaning: identity-present-in-target-only
      validation: value-exact-valid-linked-record-key-equals-derived-identity
    removed:
      kind: map-canonical-identity-to-exact-base-record
      meaning: identity-present-in-base-only
      validation: value-exact-valid-linked-record-key-equals-derived-identity
    changed:
      kind: map-canonical-identity-to-witness-pair
      witness: exact-base-record-and-exact-target-record
      meaning: identity-in-both-with-unequal-exact-content
      validation: both-records-valid-same-derived-key-base-not-equal-target
  identifiers:
    base_id:
      kind: canonical-state-content-digest
      grammar: '^gs1:[0-9a-f]{64}$'
      total_length: 68
      prefix: 'gs1:'
      derivation: sha256-over-canonical-serialization-of-full-identity-record-map
    target_id:
      kind: canonical-state-content-digest
      grammar: '^gs1:[0-9a-f]{64}$'
      total_length: 68
      prefix: 'gs1:'
      derivation: sha256-over-canonical-serialization-of-full-identity-record-map
    distinctness: equal-state-ids-imply-equal-states-and-empty-diff
  guarantees:
    completeness: every-difference-surfaces-empty-iff-equal-records
    determinism: pure-function-of-base-and-target-canonical-order
    symmetry: reverse-swaps-added-removed-and-flips-witnesses
    apply_exactness: apply-diff-to-base-yields-target-exactly
  apply:
    semantics: remove-removed-add-added-replace-changed
    base_check: recomputed-base-state-id-must-equal-diff-base-id-and-added-identities-must-be-absent
    commit: atomic-staged-copy
    target_check: recomputed-staged-target-state-id-must-equal-diff-target-id-before-return
  failures:
    classes:
      - malformed_diff_record
      - conflicting_base
      - unknown_identity
      - divergent_target
    triggers:
      malformed_diff_record: diff-or-state-shape-grammar-identity-or-record-violation
      conflicting_base: recomputed-base-id-differs-or-added-identity-already-present
      unknown_identity: changed-or-removed-identity-absent-from-base
      divergent_target: recomputed-staged-target-state-id-differs-from-diff-target-id-or-empty-diff-with-unequal-ids
    mapping:
      malformed_diff_record: malformed_request
      conflicting_base: conflicting_base
      unknown_identity: unknown_identity
      divergent_target: malformed_request
    closed: true
  errors:
    closed_enum:
      - malformed_request
      - conflicting_base
      - unknown_identity
      - internal
    shape:
      retryable_true_only_for: [internal]
  properties:
    total_compute: hostile-state-inputs-fail-closed-typed-never-raw
    structural_base_check: whole-base-verified-via-state-digest-before-mutation
    no_silent_difference: completeness-theorem-pinned
    rollback: rejected-apply-leaves-base-bit-identical
    canonical_order: sections-ordered-by-canonical-identity
    target_verification: applied-staged-result-digest-must-equal-target-id-before-return
    id_agreement: empty-diff-equal-ids-nonempty-diff-distinct-ids
  versioning:
    base_path: /graph/diff/v1
    rule: "Clients pin MAJOR. MINOR is additive-only: new optional fields, new enum members, new endpoints. Never change the meaning of an existing field in place."
  links:
    transposition_node_contract: data/contracts/transposition_node.yaml
    collision_contract: data/contracts/collision.yaml
    position_digest_contract: data/contracts/position_digest.yaml
