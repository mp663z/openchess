# T0086: chess FEN contract (implementation-neutral; the product
# runtime target is the Rust core per ADR-0001).
#
# Source of truth for FEN parsing and serialization everywhere in the
# product: position import, game import, repertoire storage, review and
# drill generation, and engine handoff all share THESE semantics. ALL
# normative semantics live in STRUCTURED fields the lint compares
# exactly - prose is documentation, never the enforcement surface.
# FEN here is the PRODUCT's position interchange form, not merely the
# grammar: a FEN that parses but names an impossible position is
# rejected, and a rejected parse yields no partial state.
schema_version: 1

contract:
  id: chess-fen
  fields:
    order: [placement, active_color, castling, en_passant,
      halfmove_clock, fullmove_number]
    exactly_six: true
    separator: single-ascii-space
    empty_field: forbidden
    rule: >-
      A FEN is exactly the six declared fields in the declared order,
      separated by single ASCII spaces. No leading, trailing, or
      repeated separators; no missing or extra fields; no empty field.
  placement:
    rank_count: 8
    rank_separator: "/"
    rank_order: rank8-to-rank1
    piece_letters: [p, n, b, r, q, k, P, N, B, R, Q, K]
    case_rule: uppercase-white-lowercase-black
    empty_run_digits: ["1", "2", "3", "4", "5", "6", "7", "8"]
    zero_digit: forbidden
    adjacent_digits: forbidden
    rank_sum: 8
    rule: >-
      Eight ranks separated by "/", first rank is rank 8. Piece
      letters are exactly the declared set; empty runs are single
      digits 1-8; every rank's pieces plus empty runs sum to exactly
      8. Zero and adjacent digits never appear in canonical form.
  position_rules:
    white_kings: exactly-1
    black_kings: exactly-1
    kings_adjacent: forbidden
    pawns_on_back_ranks: forbidden
    non_mover_king_attacked: forbidden
    rule: >-
      Exactly one white king and one black king; kings are never on
      adjacent squares; pawns never occupy rank 1 or rank 8; the king
      of the side NOT to move is never attacked (the previous move
      cannot have left it capturable). A placement violating any rule
      is an impossible position, never a parseable one.
  active_color:
    values: [w, b]
    rule: >-
      Exactly one declared side letter, lowercase.
  castling:
    none_sentinel: "-"
    letters: [K, Q, k, q]
    order: KQkq
    duplicates: forbidden
    consistency: right-requires-king-and-rook-on-start-squares
    rule: >-
      Either the none sentinel or a subsequence of KQkq in that exact
      order with no duplicates. A declared right requires the matching
      king and rook on their start squares (K: e1 h1, Q: e1 a1,
      k: e8 h8, q: e8 a8); a right without its pieces is an
      impossible position.
  en_passant:
    none_sentinel: "-"
    storage: recorded-on-every-two-square-advance
    ranks: ["3", "6"]
    rank3_requires: black-to-move
    rank6_requires: white-to-move
    pawn_presence: advancing-pawn-on-destination-square
    link: data/contracts/en_passant.yaml
    rule: >-
      Either the none sentinel or one square on rank 3 or rank 6,
      matching the sibling en-passant contract's storage semantics:
      the target is recorded after EVERY two-square advance, whether
      or not a capture is legal. Rank 3 requires black to move with
      the advancing white pawn on rank 4 of that file; rank 6
      requires white to move with the advancing black pawn on rank 5
      of that file. Anything else is impossible.
  counters:
    halfmove_clock: {type: integer, digits_only: true, min: 0}
    fullmove_number: {type: integer, digits_only: true, min: 1}
    link: data/contracts/turn.yaml
    rule: >-
      Both counters are non-negative-digit integers with the declared
      bounds, matching the sibling turn contract's counter semantics.
      No signs, no padding requirement, no non-digit characters.
  serialization:
    canonical: true
    roundtrip: parse-of-emit-is-identity
    rule: >-
      Every accepted position has exactly one canonical FEN; the
      serializer emits it, and parsing it reproduces the position
      exactly (placement, active color, castling, en-passant target,
      both counters).
  atomicity:
    parse: all-or-nothing
    rule: >-
      A rejected FEN yields no partial position, no partial field
      map, and no side effects: parse either returns the complete
      position or the declared error. There is no half-parsed state
      to roll back because nothing is committed before full
      validation.
  failure_classes: [malformed_fen, impossible_position]
  failure_mapping:
    malformed_fen: {trigger: any-fields-or-grammar-violation, error: malformed_request}
    impossible_position: {trigger: any-position_rules-castling-consistency-or-en-passant-violation, error: illegal_position}
  errors:
    closed_enum: [malformed_request, illegal_position, internal]
    shape:
      error:
        fields:
          code: {type: string, required: true}
          message: {type: string, required: true}
          retryable: {type: boolean, required: true}
  links:
    turn: data/contracts/turn.yaml
    en_passant: data/contracts/en_passant.yaml
    castling: data/contracts/castling.yaml
  versioning:
    base_path: /fen/v1
    rule: >-
      MINOR additions (new optional fields) keep the base path; MAJOR
      changes (field order, grammar, position rules, error enum
      narrowing) bump it; a consumer must never silently downgrade a
      document to a lower major version.
