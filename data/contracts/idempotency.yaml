schema_version: 1

contract:
  id: store-idempotency
  role:
    kind: keyed-exactly-once-apply-over-a-wal-logged-store
    serves: position-graph-store-durability
    scope: single-log-single-ledger-idempotent-append
    owns: idempotency-key-receipt-semantics-and-request-fingerprinting
    not_scope: key-expiry-cross-log-deduplication-or-distributed-locking
  record:
    fields: [receipt_id, idempotency_key, request_fingerprint, entry_id, sequence]
    exact: true
  identifiers:
    receipt_id:
      kind: content-addressed-idempotency-receipt-id
      grammar: ^idr1:[0-9a-f]{64}$
      derivation: sha256-over-idempotency-key-request-fingerprint-entry-id-sequence
      source: derived-from-validated-apply-never-caller-supplied
    idempotency_key:
      kind: caller-supplied-opaque-idempotency-key
      grammar: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
      source: caller-supplied-exact-built-in-string-grammar-validated
    request_fingerprint:
      kind: untrusted-fingerprinter-request-token
      grammar: ^idf1:[0-9a-f]{64}$
      derivation: sha256-over-domain-separated-length-framed-canonical-serialization-of-every-exact-frozen-request-field-except-the-key
      source: fingerprinter-output-shape-validated-and-bound-byte-exact-to-the-local-request-derivation
    entry_id:
      kind: wal-entry-id-of-the-applied-entry
      grammar: ^wal1:[0-9a-f]{64}$
      source: derived-from-the-linked-wal-append-never-caller-supplied
  outcomes:
    values: [applied, replayed]
    closed: true
    applied: unseen-key-appends-exactly-one-wal-entry-and-one-receipt
    replayed: seen-key-with-identical-fingerprint-returns-the-stored-receipt-no-append
  semantics:
    request_validation: exact-key-op-payload-shape-payload-through-linked-wal-validation
    source_validation: full-linked-wal-validation-and-full-ledger-validation-before-any-oracle-call
    ledger_binding: every-receipt-rederives-names-the-exact-live-entry-at-its-sequence-and-fingerprints-that-entry-keys-and-sequences-unique
    deduplication: key-lookup-then-byte-exact-fingerprint-comparison-never-key-only
    conflict: seen-key-with-different-fingerprint-fails-closed-never-overwrites
    commit: wal-entry-and-receipt-appended-together-last-after-full-validation-and-fingerprinting
  oracle_boundary:
    role: request-fingerprinter-is-untrusted-input
    single_evaluation: exactly-one-call-per-apply
    frozen_snapshots: request-log-and-ledger-frozen-before-first-oracle-call-never-re-read-restored-bit-identical
    output_validation: exact-built-in-string-pinned-grammar-byte-exact-request-bound-token-or-fail-closed
  failures:
    classes:
      - malformed_idempotency_request
      - corrupt_source
      - corrupt_ledger
      - key_conflict
      - divergent_fingerprint
    triggers:
      malformed_idempotency_request: request-key-op-payload-grammar-or-type-violation
      corrupt_source: source-log-fails-linked-wal-validation-or-chain-rederivation
      corrupt_ledger: ledger-shape-grammar-rederivation-uniqueness-or-live-entry-binding-violation
      key_conflict: seen-key-with-a-different-request-fingerprint
      divergent_fingerprint: fingerprinter-raising-any-baseexception-non-exact-string-bad-grammar-or-request-divergent-token
    mapping:
      malformed_idempotency_request: malformed_request
      corrupt_source: corrupt_source
      corrupt_ledger: corrupt_ledger
      key_conflict: key_conflict
      divergent_fingerprint: divergent_fingerprint
    closed: true
  errors:
    closed_enum:
      - malformed_request
      - corrupt_source
      - corrupt_ledger
      - key_conflict
      - divergent_fingerprint
      - internal
    shape:
      retryable_true_only_for: [internal]
  properties:
    total: hostile-requests-logs-ledgers-and-fingerprinters-fail-closed-typed-never-raw
    atomic: rejected-apply-leaves-log-ledger-and-request-bit-identical
    deterministic: same-inputs-same-outcome-receipt-log-and-ledger
    idempotent: repeated-identical-keyed-request-returns-the-identical-receipt-and-appends-nothing
    rollback: log-rolled-back-past-a-receipt-makes-the-stale-ledger-fail-closed-never-replayed
  versioning:
    base_path: /store/idempotency/v1
    rule: "Clients pin MAJOR. MINOR is additive-only: new optional fields, new enum members, new endpoints. Never change the meaning of an existing field in place."
  links:
    wal_contract: data/contracts/wal.yaml
    rollback_contract: data/contracts/rollback.yaml
