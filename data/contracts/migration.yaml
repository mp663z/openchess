contract:
  id: store-migration
  role:
    kind: store-schema-migration-over-content-addressed-graph-states
    serves: position-graph-store-durability
    scope: one-registered-step-per-schema-pair
    owns: migration-semantics-and-receipt-shape
    not_scope: automatic-multi-hop-chaining
  record:
    fields: [migration_id, from_schema, to_schema, source_id, target_id]
    exact: true
  identifiers:
    schema_id:
      kind: pinned-store-schema-name
      grammar: ^store-v[1-9][0-9]*$
      source: declared-in-registry-never-free-form
    state_id:
      kind: canonical-state-content-digest
      grammar: ^gs1:[0-9a-f]{64}$
      derivation: sha256-over-canonical-serialization-of-sorted-identity-record-map
      source: derived-from-validated-state-never-caller-supplied
    migration_id:
      kind: content-addressed-migration-receipt-id
      grammar: ^mg1:[0-9a-f]{64}$
      derivation: sha256-over-from-schema-to-schema-source-id-target-id
      source: derived-never-caller-supplied
  registry:
    schemas:
      - id: store-v1
        record_fields: [variant, digest, snapshot_fen]
        digest_grammar: ^pdv1:[0-9a-f]{64}$
      - id: store-v2
        record_fields: [variant, digest, snapshot_fen]
        digest_grammar: ^pdv2:[0-9a-f]{64}$
    steps:
      - from_schema: store-v1
        to_schema: store-v2
        transform: re-digest-every-record-under-target-oracle-identities-unchanged
    chaining: single-step-only-no-implicit-multi-hop
  semantics:
    source_check: recomputed-source-state-id-must-equal-request-source-id-before-migration
    target_verification: recomputed-migrated-state-id-is-the-receipt-target-id
    post_transform_validation: staged-state-validated-against-target-schema-identity-set-and-cardinality-exact
    cardinality: record-count-preserved-exactly
    identity_preservation: canonical-identities-unchanged-under-re-digest
    commit: atomic-staged-copy-source-never-mutated
  oracle_boundary:
    role: target-digest-oracle-is-untrusted-input
    single_evaluation: exactly-one-call-per-record-retained-key
    frozen_snapshots: entire-source-frozen-before-first-oracle-call-never-re-read
    request_freeze: validated-request-frozen-before-first-oracle-call-never-re-read-restored-bit-identical
    output_validation: exact-built-in-string-pinned-format-or-fail-closed
  failures:
    classes:
      - malformed_migration_record
      - unknown_migration
      - conflicting_source
      - divergent_target
    triggers:
      malformed_migration_record: request-grammar-state-or-record-violation
      unknown_migration: no-registered-step-for-schema-pair-including-noop-or-downgrade
      conflicting_source: recomputed-source-state-id-differs-from-request-source-id
      divergent_target: target-oracle-inconsistent-or-cardinality-or-identity-drift
    mapping:
      malformed_migration_record: malformed_request
      unknown_migration: unknown_migration
      conflicting_source: conflicting_source
      divergent_target: divergent_target
    closed: true
  errors:
    closed_enum:
      - malformed_request
      - unknown_migration
      - conflicting_source
      - divergent_target
      - internal
    shape:
      retryable_true_only_for: [internal]
  properties:
    total: hostile-requests-states-oracles-fail-closed-typed-never-raw
    atomic: rejected-migration-leaves-inputs-bit-identical
    deterministic: same-inputs-same-receipt
    rollback: staged-copy-only-commit-after-full-validation
  versioning:
    base_path: /store/migration/v1
    rule: "Clients pin MAJOR. MINOR is additive-only: new optional fields, new enum members, new endpoints. Never change the meaning of an existing field in place."
  links:
    transposition_node_contract: data/contracts/transposition_node.yaml
    diff_contract: data/contracts/diff.yaml
