schema_version: 1
frozen_at: '2026-09-19'
product_license: AGPL-3.0-or-later
agpl_covers:
- all chess features (import, search, memory, repertoire, delta, diagnosis, review,
  training)
- all local-first client code (core, desktop shell, thin surfaces)
- all BYOM/provider-neutral model access code (client-side provider adapters)
- data tooling that ships with or feeds the product corpus pipeline
private_side_only:
- identity
- billing
- entitlements
- quota
- provider routing and provider keys
- abuse and admin
- ops
default_rule: anything not enumerated under private_side_only is AGPL-3.0-or-later
repo_areas:
  ai-sdk: agpl
  desktop: agpl
  graph: agpl
  importers: agpl
  server: agpl
  uci-worker: agpl
  web: agpl
  .githooks: agpl
  .github: agpl
  backtest: agpl
  brand: agpl
  data: agpl
  docs: agpl
  evidence: agpl
  ingest: agpl
  requirements: agpl
  scope: agpl
  tasks: agpl
  tests: agpl
  tools: agpl
  validation: agpl
  core: agpl (planned Rust core)
  app: agpl (planned Tauri+TS shell)
  control-plane: private (planned private repo; only the enumerated areas)
root_files: agpl (LICENSE, README.md, pyproject.toml, requirements*.txt, .gitignore,
  licensing-boundary.yaml and any future root file by default rule)
