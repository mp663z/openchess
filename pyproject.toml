[project]
name = "openchess"
version = "0.0.0"
description = "Turn your own games into the three highest-impact things to train each week."
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
