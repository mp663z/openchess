# T0001 - Freeze scope (week 0, Contracts milestone)
# Machine-readable V0.1 scope freeze.
#
# Source-of-truth note: task T0001's acceptance text says "exactly seven V0.1
# capabilities". That text is stale: the v5 product report (section 11, "V0.1
# is five") and tasks/dag.json rules.v01_capability_count both fix V0.1 at
# five. The v5 report is newer than the v3 seven-capability list, so this
# freeze encodes five PRODUCT capabilities per v5 section 11 lines 396-400.
schema_version: 2
frozen_at: "2026-09-18"
sources:
  - docs/plan/product-report-v5.md (section 11, V0.1 scope after the cut)
  - tasks/dag.json
capabilities:
  - id: C1
    name: Import
    detail: >-
      PGN files and folders, dropped or watched, plus one-connect
      Lichess/Chess.com account sync on the casual path. Pro path keeps
      PGN-drop and CBH as primary. Sync is scoped to the casual onboarding
      fork - nothing broader.
  - id: C2
    name: Search
    detail: By player, position, move sequence.
  - id: C3
    name: Personal memory
    detail: >-
      Comments, engine analysis and source games retrieved by position, with
      full provenance, regardless of which file they came from.
  - id: C4
    name: Repertoire + Delta + Diagnosis
    detail: >-
      Versioned lines with transposition-correct matching; the scoring
      function (v5 section 7) computed on every import; recurring-error
      diagnosis over the user's own games, feeding the weekly plan.
  - id: C5
    name: Review + Training on the web/mobile habit surface
    detail: >-
      Approve/reject against cited evidence with visible diffs; the three-item
      weekly plan and drills built from the user's own positions; E2E
      encrypted sync to the desktop core. Anki/Chessable export ships
      alongside as a feature, not the training story.
